version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auto_scrolling_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DEBUG=True
    volumes:
      - ./backend/storage:/app/backend/storage
    restart: unless-stopped
